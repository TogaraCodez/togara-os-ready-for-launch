[package]
name = "togara-kernel"
version = "0.3.0"
edition = "2021"
description = "TOGARA OS Trinity - Bootable kernel with VGA, interrupts, and userspace"

[dependencies]
spin = "0.9"
bootloader = "0.9"
volatile = "0.4"
zero = "0.1"

[features]
default = []

[[bin]]
name = "togara-kernel"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
