[workspace]
resolver = "3"
members = ["kernel"]

[package]
name = "togara-os"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
lazy_static = { version = "1.5.0", default-features = false, features = ["spin_no_std"] }
ovmf-prebuilt = "0.2.9"

[build-dependencies]
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }
bootloader = "=0.11.16"